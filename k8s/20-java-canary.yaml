# Қарапайым қолмен басқарылатын Canary: Service stable және canary подтарын бірге таңдайды.
# Canary-ді үлкейту/кішірейту үшін replicas мәнін өзгертіңіз.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-redis-canary
  labels:
    app: java-redis-app
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-redis-app
      track: canary
  template:
    metadata:
      labels:
        app: java-redis-app
        track: canary
    spec:
      containers:
        - name: java-redis-app
          image: java-redis-app:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: APP_VERSION
              value: canary
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
